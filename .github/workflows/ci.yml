name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: sqlite3, mbstring, bcmath, ctype, fileinfo
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: api/vendor
          key: composer-${{ hashFiles('api/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (Larastan)
        run: vendor/bin/phpstan analyse --memory-limit=512M

      - name: Tests (Pest)
        run: vendor/bin/pest

  frontend:
    name: Frontend (Vue)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npx eslint .

      - name: Tests (Vitest)
        run: npx vitest run

      - name: Type-check and build
        run: npm run build

  # Avisos de seguridad de las dependencias de producción del frontend. Aparte y
  # fuera de `needs` de deploy: un aviso nuevo de un tercero pone el CI en rojo
  # (se ve), pero no impide desplegar un cambio que no tiene nada que ver.
  audit:
    name: Frontend dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit (production)
        run: npm audit --omit=dev --audit-level=high

  # Prueba de humo de principio a fin: el build de la app contra el API real con
  # una SQLite desechable, en un Chrome de verdad (ver web/playwright.config.ts).
  # Informativo de momento: NO bloquea el despliegue (no está en `needs` de
  # deploy) hasta que demuestre ser estable.
  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: sqlite3, mbstring, bcmath, ctype, fileinfo
          coverage: none
          # El API de pruebas es un proceso PHP que vive toda la ejecución: sin
          # opcache/JIT (que setup-php activa por defecto) para no depender de
          # fallos del motor en procesos largos (ver el CI de PequeDex).
          ini-values: opcache.enable_cli=0, opcache.jit=0

      - name: Install API dependencies
        working-directory: api
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare API environment
        working-directory: api
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      # Usa el Chrome que ya traen los runners de GitHub (channel: 'chrome').
      - name: Run the end-to-end tests
        working-directory: web
        run: npx playwright test

      - name: Show the API log of a failed run
        if: failure()
        run: tail -n 120 api/storage/logs/laravel.log || true

      - name: Upload traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: web/test-results
          retention-days: 7
          if-no-files-found: ignore

  attribution-guard:
    name: Attribution Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 50

      - name: Check commit messages for disallowed AI attribution
        run: |
          C1="cla"; C2="ude"; CL="$C1$C2"
          A1="anthr"; A2="opic"; AN="$A1$A2"
          PATTERN="co-authored-by:.*$CL|$CL-session:|noreply@$AN\.com|@$AN\.com|generated with .?$CL|$CL\.ai/code"
          if git log -50 --format=%B | grep -qiE "$PATTERN"; then
            echo "::error::A recent commit message contains a disallowed AI attribution pattern - never allowed in this repo."
            git log -50 --oneline | head -5
            exit 1
          fi
          echo "Clean - no disallowed attribution pattern found in the last 50 commits."

  deploy:
    name: Trigger Render deploy
    needs: [backend, frontend, attribution-guard]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Call Render deploy hook
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
