name: Keep API awake

# Render's Free plan spins the API down after a stretch of inactivity, and
# the first real request after that waits ~50s for it to wake back up - a
# client's first page load of the day pays that cost with no idea why.
# A GET every 10 minutes (comfortably under Render's own inactivity
# threshold) keeps the container warm, at no cost - GitHub Actions'
# scheduled workflows are free on both public and private repos for a job
# this short and infrequent. /up is Laravel's own built-in health check
# route (bootstrap/app.php, health: '/up') - no DB query, just confirms the
# app booted.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /up
        run: curl -sf --max-time 55 https://ludodex-api.onrender.com/up
