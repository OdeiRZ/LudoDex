; OPcache para el contenedor de producción (php artisan serve, plan Free de Render).
;
; Sin OPcache, PHP vuelve a leer y compilar cientos de ficheros del framework en
; CADA petición: en la CPU mínima del plan gratuito, buena parte de los ~250 ms que
; tardaba hasta un endpoint trivial. El servidor de desarrollo integrado de PHP
; (`artisan serve`, con PHP_CLI_SERVER_WORKERS) corre en CLI, así que hace falta
; enable_cli; la memoria compartida se crea antes de lanzar los trabajadores y la
; comparten todos.
opcache.enable=1
opcache.enable_cli=1

; El contenedor es inmutable (el código no cambia mientras corre): no hace falta
; comprobar la fecha de cada fichero en cada petición.
opcache.validate_timestamps=0

; Holgado para Laravel + vendor (unos pocos miles de ficheros) sin gastar RAM del
; plan gratuito (512 MB).
opcache.memory_consumption=96
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000

; Sin JIT: no ayuda a código orientado a E/S como este y consume más memoria.
opcache.jit=off
